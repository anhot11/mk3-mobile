plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ea.game.umk3'
    compileSdk 34

    defaultConfig {
        applicationId "com.ea.game.umk3"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "1.4.0"

        ndk {
            abiFilters 'armeabi-v7a', 'x86'
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
}
