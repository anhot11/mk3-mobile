name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Game Assets and Data Tables
        run: |
          if [ ! -f "logic_tables.c" ] || [ ! -d "res" ]; then
            echo "Downloading UMK3 IPA for tables and assets..."
            curl -L -o umk3.ipa "https://archive.org/download/ultimate-mortal-kombat-3-v-1.2.59/Ultimate%20Mortal%20Kombat%203%20v1.2.59.ipa"
            
            echo "Extracting IPA..."
            python3 tools/extract_ipa.py umk3.ipa
            
            echo "Generating data tables..."
            python3 tools/logic_tables.py Payload/UMK3.app/UMK3 logic_tables.c --report logic_tables_report.txt
            python3 tools/level_info.py Payload/UMK3.app/UMK3 level_info.c
            python3 tools/seq_data.py Payload/UMK3.app/UMK3 seq_data.c
            
            rm -f umk3.ipa
            rm -rf Payload
          fi

      - name: Copy Assets into Android App Project
        run: |
          mkdir -p android/app/src/main/assets
          if [ -d "res" ]; then
            cp -r res android/app/src/main/assets/
          fi
          if [ -f "Info.plist" ]; then
            cp Info.plist android/app/src/main/assets/
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK with Gradle
        working-directory: android
        run: |
          gradle assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Mortal-Kombat-3-Android-APK
          path: android/app/build/outputs/apk/**/*.apk
